<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meridian: Vice Coast</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#120A24">
<meta name="description" content="RP textual em Miami, 2026. Quatro facções, vinte vagas: Dinastia Castillo, Família Navarro, Cartel Los Huesos e Força-Tarefa de Miami.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&family=Mr+Dafoe&family=Syncopate:wght@400;700&display=swap">
<style>
/* Layout: um postal de Ocean Drive que escurece para a noite. Foto de pôr do sol no topo,
   seções em índigo com letreiros néon, etiquetas em mono com coordenadas e cores por facção. */
:root {
  color-scheme: dark;
  --night: #120A24;
  --night-2: #1A1133;
  --night-3: #241845;
  --line: #33265C;
  --line-2: #4A3A80;
  --ink: #F8F0FF;
  --ink-2: #CDBDEB;
  --ink-3: #9886C2;
  --pink: #FF5FA2;
  --sun: #FFB36B;
  --cyan: #5CD2F2;
  --lilac: #B99CFF;
  --mint: #5BE3A6;
  --amber: #FFC857;
  --danger: #FF7A85;
  --on-bright: #1A0F2E;
  --sunset: linear-gradient(100deg, #8C7BE0 0%, #FF5FA2 50%, #FFB36B 100%);
  --f-display: "Syncopate", "Arial Black", Arial, sans-serif;
  --f-script: "Mr Dafoe", "Brush Script MT", "Segoe Script", cursive;
  --f-body: "Figtree", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --r: 18px;
  --r-sm: 10px;
  --max: 1120px;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--night); -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--night);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 60; background: var(--night);
}
img { max-width: 100%; display: block; }
a { color: inherit; }
button, input, textarea, select { font: inherit; color: inherit; }
::selection { background: var(--pink); color: var(--on-bright); }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; border-radius: 6px; }
#view:focus, #view:focus-visible { outline: none; }

.wrap {
  width: 100%;
  max-width: calc(var(--max) + 64px);
  margin-inline: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
@media (min-width: 720px) {
  .wrap {
    padding-left: max(32px, env(safe-area-inset-left, 0px));
    padding-right: max(32px, env(safe-area-inset-right, 0px));
  }
}

/* ---------- Type ---------- */
.eyebrow {
  font-family: var(--f-mono); font-size: 12px; font-weight: 500;
  letter-spacing: .16em; text-transform: uppercase; color: var(--ink-3); margin: 0;
}
.display {
  font-family: var(--f-display); font-weight: 700; text-transform: uppercase;
  letter-spacing: .04em; line-height: 1.05; margin: 0; text-wrap: balance;
}
.neon {
  font-family: var(--f-script); font-weight: 400; color: #FFD3E6; line-height: 1;
  text-shadow: 0 0 4px rgba(255, 95, 162, .95), 0 0 14px rgba(255, 95, 162, .75), 0 0 36px rgba(255, 95, 162, .45);
}
h2, h3, h4 { text-wrap: balance; }
.lead { font-size: clamp(18px, 2.4vw, 21px); line-height: 1.55; color: var(--ink-2); max-width: 40em; margin: 0; }
.muted { color: var(--ink-3); }
.mono { font-family: var(--f-mono); }
.prose p { margin: 0 0 1.05em; max-width: 65ch; color: var(--ink-2); }
.prose p:last-child { margin-bottom: 0; }

.sec { padding-block: clamp(48px, 8vw, 96px); }
.sec-head { display: grid; gap: 10px; margin-bottom: clamp(24px, 4vw, 40px); }
.sec-title { font-family: var(--f-display); font-weight: 700; text-transform: uppercase; letter-spacing: .03em; font-size: clamp(22px, 4.2vw, 36px); line-height: 1.12; margin: 0; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 46px; padding: 0 20px; border-radius: 999px; border: 1px solid transparent;
  font-weight: 700; font-size: 15px; letter-spacing: .01em; text-decoration: none; cursor: pointer;
  transition: transform .15s ease, box-shadow .2s ease, background .2s ease, border-color .2s ease;
  white-space: nowrap;
}
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--sunset); color: var(--on-bright); box-shadow: 0 8px 28px -10px rgba(255, 95, 162, .8); }
.btn-primary:hover { box-shadow: 0 10px 34px -8px rgba(255, 95, 162, .95); }
.btn-ghost { background: rgba(26, 17, 51, .55); color: var(--ink); border-color: var(--line-2); }
.btn-ghost:hover { border-color: var(--ink-3); }
.btn-quiet { background: transparent; color: var(--ink-2); border-color: transparent; padding: 0 10px; }
.btn-quiet:hover { color: var(--ink); }
.btn-danger { background: transparent; color: var(--danger); border-color: rgba(255, 122, 133, .45); }
.btn-ok { background: var(--mint); color: var(--on-bright); }
.btn-sm { min-height: 38px; padding: 0 14px; font-size: 14px; }
.btn[disabled] { opacity: .55; cursor: not-allowed; }
.btn-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* ---------- Header ---------- */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50;
  background: rgba(18, 10, 36, .82); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid rgba(74, 58, 128, .5);
}
.top-in { display: flex; align-items: center; gap: 12px; min-height: 62px; }
.logo { display: inline-flex; align-items: baseline; gap: 8px; text-decoration: none; flex: none; }
.logo-a { font-family: var(--f-display); font-weight: 700; font-size: 15px; letter-spacing: .14em; }
.logo-b { font-family: var(--f-script); font-size: 22px; color: #FFD3E6; text-shadow: 0 0 10px rgba(255, 95, 162, .8); transform: translateY(2px); }
.nav { display: none; gap: 2px; margin-left: auto; }
.nav a {
  text-decoration: none; font-size: 14px; font-weight: 600; color: var(--ink-2);
  padding: 8px 12px; border-radius: 999px;
}
.nav a:hover { color: var(--ink); background: var(--night-3); }
.nav a[aria-current="page"] { color: var(--ink); background: var(--night-3); box-shadow: inset 0 -2px 0 var(--pink); }
.top-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.chip-user {
  display: inline-flex; align-items: center; gap: 8px; max-width: 170px;
  min-height: 38px; padding: 0 12px 0 6px; border-radius: 999px; text-decoration: none;
  background: var(--night-3); border: 1px solid var(--line-2); font-size: 14px; font-weight: 600;
}
.chip-user span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.avatar {
  width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; flex: none;
  background: var(--sunset); color: var(--on-bright); font-weight: 800; font-size: 13px;
}
.logo { min-width: 0; }
.top-actions { flex: none; }
@media (max-width: 479px) {
  .chip-user { padding: 0 4px; }
  .chip-user span:last-child { display: none; }
}
@media (max-width: 400px) {
  .logo-a { font-size: 13px; letter-spacing: .1em; }
  .logo-b { font-size: 19px; }
}
@media (max-width: 380px) { .logo-b { display: none; } }
.menu-btn {
  width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line-2);
  background: var(--night-2); display: grid; place-items: center; cursor: pointer;
}
.menu-btn svg { width: 20px; height: 20px; }
@media (min-width: 980px) {
  .nav { display: flex; }
  .top-actions { margin-left: 8px; }
  .menu-btn { display: none; }
}
.drawer {
  position: fixed; inset: 0; z-index: 70; background: rgba(10, 5, 22, .7);
  display: flex; justify-content: flex-end;
}
.drawer-panel {
  width: min(360px, 88vw); height: 100%; background: var(--night-2); border-left: 1px solid var(--line);
  padding: calc(env(safe-area-inset-top, 0px) + 18px) max(20px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 24px) 22px;
  display: flex; flex-direction: column; gap: 6px; overflow-y: auto;
}
.drawer-panel a {
  text-decoration: none; padding: 14px 4px; border-bottom: 1px solid var(--line);
  font-family: var(--f-display); font-weight: 700; font-size: 15px; letter-spacing: .08em; text-transform: uppercase;
  display: flex; justify-content: space-between; align-items: center;
}
.drawer-panel a[aria-current="page"] { color: var(--pink); }
.drawer-panel a small { font-family: var(--f-mono); font-size: 11px; color: var(--ink-3); letter-spacing: .1em; }
.drawer-close { align-self: flex-end; margin-bottom: 8px; }

/* ---------- Demo banner ---------- */
.demo-bar { background: linear-gradient(90deg, rgba(255, 179, 107, .16), rgba(255, 95, 162, .12)); border-bottom: 1px solid rgba(255, 179, 107, .3); }
.demo-bar .wrap { display: flex; gap: 10px; align-items: center; padding-block: 8px; font-size: 13px; color: var(--ink-2); flex-wrap: wrap; }
.demo-bar b { color: var(--sun); font-family: var(--f-mono); font-weight: 500; letter-spacing: .1em; font-size: 11px; text-transform: uppercase; }

/* ---------- Hero ---------- */
.hero {
  position: relative; overflow: hidden; isolation: isolate;
  background: #2A1A4F url("img/ocean-drive.webp") center 64% / cover no-repeat;
}
.hero::before {
  content: ""; position: absolute; inset: 0; z-index: -1;
  background:
    linear-gradient(180deg, rgba(18, 10, 36, .25) 0%, rgba(18, 10, 36, .05) 30%, rgba(18, 10, 36, .55) 70%, var(--night) 100%),
    radial-gradient(120% 80% at 50% 110%, rgba(18, 10, 36, .9), transparent 60%);
}
.hero .wrap { padding-block: clamp(72px, 14vw, 150px) clamp(40px, 7vw, 72px); display: grid; gap: 22px; }
.hero-meta { display: flex; flex-wrap: wrap; gap: 8px 16px; }
.hero-meta span { font-family: var(--f-mono); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: #FFF1F8; text-shadow: 0 1px 8px rgba(18, 10, 36, .6); }
.hero-title { display: grid; justify-items: start; }
.hero-title .display {
  font-size: clamp(34px, 10.4vw, 132px); letter-spacing: .05em; line-height: .95;
  background: linear-gradient(180deg, #FFF4FA 0%, #FFD6B0 50%, #FF8FC0 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 6px 28px rgba(18, 10, 36, .45));
}
.hero-title .neon { font-size: clamp(54px, 13vw, 150px); margin-top: -.28em; margin-left: .35em; transform: rotate(-6deg); transform-origin: left center; }
.hero-tag { font-size: clamp(18px, 2.6vw, 23px); line-height: 1.45; max-width: 30em; margin: 0; color: #FFF3FA; text-shadow: 0 2px 14px rgba(18, 10, 36, .7); }
@media (prefers-reduced-motion: no-preference) {
  .hero-title .neon { animation: flicker 2.4s ease-out .3s both; }
  @keyframes flicker {
    0% { opacity: .2; } 8% { opacity: 1; } 10% { opacity: .35; } 14% { opacity: 1; }
    40% { opacity: .9; } 42% { opacity: 1; } 100% { opacity: 1; }
  }
}

.page-hero {
  position: relative; isolation: isolate; overflow: hidden;
  background: #2A1A4F url("img/palmeiras.webp") center 30% / cover no-repeat;
}
.page-hero::before {
  content: ""; position: absolute; inset: 0; z-index: -1;
  background: linear-gradient(180deg, rgba(18, 10, 36, .2), rgba(18, 10, 36, .55) 55%, var(--night));
}
.page-hero .wrap { padding-block: clamp(56px, 10vw, 110px) clamp(28px, 5vw, 52px); display: grid; gap: 12px; }
.page-hero .eyebrow { color: #FFE3F1; }
.page-hero h1 { font-size: clamp(26px, 7vw, 72px); overflow-wrap: break-word; }
.page-hero .lead { color: #F6E8FF; text-shadow: 0 2px 12px rgba(18, 10, 36, .7); }

/* ---------- Generic blocks ---------- */
.notice {
  display: grid; gap: 6px; padding: 18px 20px; border-radius: var(--r);
  background: linear-gradient(120deg, rgba(255, 95, 162, .14), rgba(140, 123, 224, .12));
  border: 1px solid rgba(255, 95, 162, .35);
}
.notice p { margin: 0; }
.panel { background: var(--night-2); border: 1px solid var(--line); border-radius: var(--r); padding: clamp(18px, 3vw, 28px); }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); }
.g4 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); }
.kv { display: grid; gap: 4px; }
.kv dt { font-family: var(--f-mono); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-3); }
.kv dd { margin: 0; font-weight: 600; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 160px), 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.facts > div { background: var(--night-2); padding: 16px 18px; }

.tag {
  display: inline-flex; align-items: center; gap: 6px; font-family: var(--f-mono); font-size: 11px; letter-spacing: .12em;
  text-transform: uppercase; padding: 4px 9px; border-radius: 999px; border: 1px solid currentColor; line-height: 1.3; white-space: nowrap;
}
.dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex: none; }

/* status pills */
.pill {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px;
  font-size: 12px; font-weight: 700; letter-spacing: .02em; line-height: 1.3; white-space: nowrap;
  background: rgba(18, 10, 36, .82); border: 1px solid; backdrop-filter: blur(6px);
}
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.st-livre { color: var(--mint); border-color: rgba(91, 227, 166, .5); }
.st-reservada { color: var(--amber); border-color: rgba(255, 200, 87, .5); }
.st-analise { color: var(--lilac); border-color: rgba(185, 156, 255, .5); }
.st-ocupada { color: var(--ink-2); border-color: rgba(205, 189, 235, .4); }
.st-ajustes { color: var(--sun); border-color: rgba(255, 179, 107, .5); }

/* ---------- Faction cards (home) ---------- */
.fac-card {
  --fac: var(--pink);
  position: relative; display: grid; gap: 12px; padding: 22px; border-radius: var(--r);
  background: linear-gradient(160deg, color-mix(in srgb, var(--fac) 16%, var(--night-2)), var(--night-2) 60%);
  border: 1px solid color-mix(in srgb, var(--fac) 38%, var(--line));
  text-decoration: none; transition: transform .2s ease, border-color .2s ease;
}
.fac-card:hover { transform: translateY(-2px); border-color: var(--fac); }
.fac-card .eyebrow { color: var(--fac); }
.fac-card h3 { font-family: var(--f-display); font-size: 17px; letter-spacing: .05em; text-transform: uppercase; margin: 0; line-height: 1.25; }
.fac-card p { margin: 0; color: var(--ink-2); font-size: 15px; }
.fac-card .meter { margin-top: auto; }
.meter { display: grid; gap: 6px; }
.meter-bar { display: flex; height: 6px; border-radius: 99px; overflow: hidden; background: var(--night-3); gap: 2px; }
.meter-bar i { display: block; height: 100%; }
.meter-bar .m-livre { background: var(--mint); }
.meter-bar .m-reservada { background: var(--amber); }
.meter-bar .m-analise { background: var(--lilac); }
.meter-bar .m-ocupada { background: var(--ink-3); }
.meter-txt { font-family: var(--f-mono); font-size: 12px; color: var(--ink-3); letter-spacing: .04em; font-variant-numeric: tabular-nums; }

/* ---------- City / timeline ---------- */
.story { display: grid; gap: 32px; }
@media (min-width: 900px) { .story { grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr); gap: 56px; } }
.story-aside { display: grid; gap: 14px; align-content: start; }
@media (min-width: 900px) { .story-aside { position: sticky; top: 96px; } }
.story-aside h2 { font-family: var(--f-display); text-transform: uppercase; letter-spacing: .03em; font-size: clamp(22px, 3.2vw, 32px); line-height: 1.15; margin: 0; }
.dropcap::first-letter { font-family: var(--f-display); font-weight: 700; float: left; font-size: 3.4em; line-height: .9; margin: .06em .12em 0 0; color: var(--pink); }
.pull { margin: 8px 0 0; padding: 22px 0 0; border-top: 1px solid var(--line); font-family: var(--f-display); text-transform: uppercase; letter-spacing: .03em; font-size: clamp(17px, 2.4vw, 22px); line-height: 1.35; color: var(--ink); max-width: 30em; }
.timeline { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; position: relative; }
.timeline li { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 18px; padding: 18px 0; border-top: 1px solid var(--line); }
.timeline li:last-child { border-bottom: 1px solid var(--line); }
.timeline .yr { font-family: var(--f-mono); font-weight: 500; color: var(--sun); font-size: 14px; letter-spacing: .06em; font-variant-numeric: tabular-nums; }
.timeline h3 { margin: 0 0 4px; font-size: 17px; }
.timeline p { margin: 0; color: var(--ink-2); font-size: 15px; }
.timeline li.now .yr { color: var(--pink); }
@media (max-width: 520px) { .timeline li { grid-template-columns: 1fr; gap: 4px; } }

/* ---------- Factions page ---------- */
.fac-nav { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.fac-nav::-webkit-scrollbar { display: none; }
.fac-nav a { --fac: var(--pink); text-decoration: none; color: var(--fac); flex: none; }
.fac-sec { --fac: var(--pink); border-top: 1px solid var(--line); scroll-margin-top: 72px; }
.fac-head { display: grid; gap: 10px; margin-bottom: 26px; }
.fac-head .eyebrow { color: var(--fac); }
.fac-head h2 { font-family: var(--f-display); font-weight: 700; text-transform: uppercase; letter-spacing: .03em; font-size: clamp(24px, 6vw, 58px); line-height: 1.05; margin: 0; overflow-wrap: break-word; }
.fac-head .poder { margin: 0; color: var(--ink-2); font-size: 17px; }
.fac-head .poder b { color: var(--ink); }
.gallery { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(240px, 78%); gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 6px; scrollbar-width: thin; }
@media (min-width: 760px) { .gallery { grid-auto-flow: row; grid-template-columns: repeat(3, minmax(0, 1fr)); overflow: visible; } }
.tile {
  position: relative; aspect-ratio: 4 / 5; max-width: 100%; border-radius: var(--r); overflow: hidden; scroll-snap-align: start;
  background: var(--night-3) center / cover no-repeat; isolation: isolate; border: 1px solid var(--line);
}
.tile img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.tile::before { content: ""; position: absolute; inset: 0; z-index: 1; background: var(--fac); mix-blend-mode: color; opacity: .38; pointer-events: none; }
.tile.has-img::before { display: none; }
.tile::after { content: ""; position: absolute; inset: 0; z-index: 1; background: linear-gradient(180deg, transparent 45%, rgba(18, 10, 36, .92)); }
.tile figcaption { position: absolute; left: 16px; right: 16px; bottom: 14px; z-index: 2; display: grid; gap: 2px; }
.tile figcaption .eyebrow { color: var(--fac); }
.tile figcaption b { font-size: 17px; line-height: 1.3; }
.ph-1 { background-image: url("img/palmeiras.webp"); background-position: 55% 22%; }
.ph-2 { background-image: url("img/ocean-drive.webp"); background-position: 70% 92%; }
.ph-3 { background-image: url("img/ocean-drive.webp"); background-position: 22% 58%; }
.ph-4 { background-image: url("img/palmeiras.webp"); background-position: 85% 78%; }
.ph-5 { background-image: url("img/ocean-drive.webp"); background-position: 50% 30%; }
.ph-6 { background-image: url("img/palmeiras.webp"); background-position: 10% 60%; }

.fac-story { display: grid; gap: 28px; margin-top: clamp(32px, 5vw, 56px); }
@media (min-width: 900px) { .fac-story { grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr); gap: 56px; } }
.fac-story h3 { font-family: var(--f-display); text-transform: uppercase; font-size: clamp(20px, 2.8vw, 28px); letter-spacing: .03em; line-height: 1.2; margin: 6px 0 0; }
@media (min-width: 900px) { .fac-story-aside { position: sticky; top: 96px; align-self: start; } }
.fac-story-aside .eyebrow { color: var(--fac); }
.traits { display: grid; gap: 12px; margin-top: 22px; }
.trait { display: grid; gap: 4px; padding: 16px 18px; border-radius: var(--r-sm); background: var(--night-2); border: 1px solid var(--line); }
.trait dt { font-family: var(--f-mono); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--fac); }
.trait dd { margin: 0; color: var(--ink-2); font-size: 15px; }
